services:
  postgres:
    image: postgres:17-alpine
    container_name: music-class-postgres
    ports:
      - '127.0.0.1:${PG_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-musicclass}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-musicclass}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-class-api
    ports:
      - '127.0.0.1:3333:3333'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: info
      APP_KEY: ${APP_KEY:-localdevkeylocaldevkeylocaldevke}
      APP_URL: http://localhost:3333
      SESSION_DRIVER: cookie
      DB_CONNECTION: pg
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-musicclass}
      DATABASE_DIRECT_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-musicclass}
      DB_SSL: 'false'
      AUTO_MIGRATE: 'true'
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173,http://localhost:5174
      TZ: UTC
      SIGNUP_INVITE_CODE: ${SIGNUP_INVITE_CODE:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      BACKUP_EMAIL_TO: ${BACKUP_EMAIL_TO:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api_data:/app/tmp
      - api_backups:/app/backups
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3333/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3333
    container_name: music-class-frontend
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  api_data:
  api_backups:
