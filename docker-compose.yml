services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: music-class-api
    ports:
      - '3333:3333'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      LOG_LEVEL: info
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env or the shell}
      APP_URL: http://localhost:3333
      SESSION_DRIVER: cookie
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173,http://localhost:5174
      TZ: UTC
    volumes:
      - api_data:/app/tmp
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3333/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3333
    container_name: music-class-frontend
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api_data:
