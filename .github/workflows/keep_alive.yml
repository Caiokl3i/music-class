name: Supabase Keep-Alive

on:
  schedule:
    # Runs daily at 12:00 UTC (09:00 BRT) to prevent 7-day inactivity pause
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Health & Keep-Alive Ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping API /health endpoint
        env:
          TARGET_URL: ${{ secrets.API_URL || secrets.APP_URL || 'https://music-class-api.vercel.app' }}
        run: |
          URL="${TARGET_URL%/}/health"
          echo "🌐 Sending keep-alive request to: $URL"

          RESPONSE=$(curl -fsSL --max-time 30 "$URL") || {
            echo "❌ Error: Keep-alive request failed to connect to $URL." >&2
            exit 1
          }

          echo "Response payload: $RESPONSE"

          if echo "$RESPONSE" | grep -q '"database":"connected"'; then
            echo "✅ Keep-alive successful: Database connected and query executed."
          else
            echo "❌ Error: Health check did not return database:connected. Payload: $RESPONSE" >&2
            exit 1
          fi
