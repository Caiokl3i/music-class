name: Database Backup

on:
  schedule:
    # Runs daily at 04:00 UTC (01:00 BRT)
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup PostgreSQL Database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Execute Backup Script
        env:
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL || secrets.PROD_DATABASE_URL || secrets.DATABASE_URL }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION || 'auto' }}
          BACKUP_RETENTION_DAYS: 14
        run: |
          chmod +x scripts/backup_postgres.sh
          ./scripts/backup_postgres.sh

      - name: Archive backup artifact (Retention 7 days)
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_id }}
          path: ./backups/*.dump
          retention-days: 7
          if-no-files-found: error
